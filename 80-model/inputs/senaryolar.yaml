# ============================================================================
# RFQ HACİM KADEMELERİ — KURUCU KARARI (TUR 3.25, 2026-08-10)
# ============================================================================
# ⛔ BU BLOK `hacim_senaryolari` DEGILDIR VE ONUN YERINE GECMEZ.
#    `hacim_senaryolari`    = MODEL senaryolari, birimi YILLIK sise (charter).
#    `rfq_hacim_kademeleri` = TEDARIKCIYE SORULACAK fiyat noktalari.
#    Ikisinin BAZI ayni olmayabilir (bkz. baz_belirsizligi) — esleme
#    PROVISIONAL'dir ve T-961 kapanmadan KESINLESMEZ.
rfq_hacim_kademeleri:
  status: INVESTOR_DECISION            # FACT DEGIL, ESTIMATE DEGIL, GOZLEM DEGIL
  evidence_id: null                    # BIR DIS OLGU DEGILDIR -> kanit karti YOKTUR
  kaynak: "kurucu/yatirimci beyani — TUR 3.25 §0, 2026-08-10"
  karar_tarihi: 2026-08-10
  ref: 90-karar/investor-kararlari-tur325.md
  amac: >-
    Tedarikcinin PRICE-VOLUME CURVE'unu gormek. TEK BIR hacim icin TEK BIR
    fiyat ISTENMEYECEKTIR.

  baz_belirsizligi:                    # ⚠ KURUCU BEYANI BUNU SOYLEMEDI — ACIK
    soru: "Kademeler YILLIK hacim mi, SIPARIS/SEVKIYAT basina mi?"
    status: UNKNOWN
    neden: >-
      rfq-template.md IKI AYRI baz tasimaktadir: "Indicative annual volume:
      <VOLUME> bottles/year" ve "First (pilot) order: <PILOT VOLUME> bottles".
      FULL_20FT ise ancak SEVKIYAT BASINA tanimlidir. Kurucu beyani bazi
      belirtmemistir ve baskan bunu KENDI DOLDURMAZ (CLAUDE.md §1.16).
    ticket: T-961

  kademeler:
    - id: V1
      sise: 5000
      model_karsiligi: V5K
      esleme_status: PROVISIONAL
      notes: >-
        T-871'e gore 5.000 ILK SIPARIS olarak alinirsa Kart 1 (Harland) ve
        Kart 2 (Danese) MOQ 6.000 ile UYUMSUZDUR (T-855, C-462). Bu bir FIYAT
        sorusu degil, bir ELEME sorusudur.
    - id: V2
      sise: 10000
      model_karsiligi: V10K
      esleme_status: PROVISIONAL
      notes: >-
        YENI FIYAT NOKTASI. V10K senaryolar.yaml'da TANIMLIDIR ama ters modelde
        HIC CALISTIRILMAMISTIR ve lojistik tablolarinda SATIRI YOKTUR (T-855).
        Kurucu kararindan sonra bu bir bosluk degil, bir EKSIKTIR.
    - id: V3
      sise: 25000
      model_karsiligi: V25K
      esleme_status: PROVISIONAL
    - id: V4
      sise: 50000
      model_karsiligi: V50K
      esleme_status: PROVISIONAL
    - id: FULL_20FT
      sise: null
      status: UNKNOWN
      ayri_fiyat_istenecek: true
      band_paletli_sise: [6480, 7200]
      band_paletsiz_sise: [11800, 13700]
      band_evidence_id: EV-2026-08-09-320
      band_status: ESTIMATE
      notes: >-
        "Dolu bir 20ft konteyner" BIR SISE ADEDI DEGILDIR: adet paletli/paletsiz
        yukleme bicimine ve TEDARIKCININ koli/palet konfigurasyonuna baglidir
        (RFQ zorunlu alanlari M3/M4 — T-884). Ayni "full 20ft" fiyati iki
        tedarikcide FARKLI sise adedi anlamina gelebilir; o durumda SISE BASI
        fiyat KARSILASTIRILAMAZ. Bu kademenin kiyaslanabilirligi M3/M4
        cevaplarina BAGLIDIR.
      ticket: [T-962, T-884]

  sorulmayacak:
    - id: V100K
      sise: 100000
      karar: "ILK RFQ'DA SORULMAYACAK (kurucu karari, TUR 3.25)."
      model_sonucu: >-
        V100K bir MODEL senaryosu olarak KALIR (charter tarafindan belirlenmistir,
        SILINMEZ) — ancak ILK RFQ turundan bir FIYAT CAPASI ALMAYACAKTIR.
        V50K fiyatindan V100K'ya EKSTRAPOLASYON YASAKTIR. V100K alis fiyati
        UNKNOWN kalir ve o satirdan turetilen her cikti NO_RFQ_ANCHOR damgasi
        tasir.
      ticket: T-963

  lojistik_baglantisi:
    lcl_fcl_kirilma_merkez_sise: 5900
    kirilma_evidence_id: EV-2026-08-10-330
    kirilma_status: ESTIMATE
    kirilma_confidence: LOW
    kirilma_band_sise: [2200, 9800]
    sonuc: >-
      V1 (5.000) kirilma noktasinin ALTINDA, V2 (10.000) USTUNDEDIR. Kademeler
      arasinda yalnizca fiyat degil MOD (LCL/FCL) da degisebilir; sise basi
      lojistik maliyeti kademeler arasinda DOGRUSAL DEGILDIR.
      KADEMELER ARASI INTERPOLASYON YAPILMAZ.
    ticket: [T-962, T-855, T-913]

  baglayici_kurallar:
    - kod: TR325-V1
      kural: "Tedarikciden TEK hacim fiyati istenmez; HER kademe icin AYRI fiyat istenir."
    - kod: TR325-V2
      kural: "Gelen fiyatlar KADEME BAZINDA saklanir; ortalamasi ALINMAZ, tek fiyata indirgenmez."
    - kod: TR325-V3
      kural: >-
        Kademeler arasinda INTERPOLASYON ve kademe disina EKSTRAPOLASYON
        YAPILMAZ (ayni kural T-855'te 10.000 icin zaten uygulanmisti).
    - kod: TR325-V4
      kural: >-
        Bir kademede MOQ uyumsuzlugu cikarsa bu bir fiyat notu degil bir ELEME
        kaydidir ve ticket'a baglanir.
    - kod: TR325-V5
      kural: >-
        BU BLOK BIR HACIM TAAHHUDU DEGILDIR. Kademeler tedarikciye sorulacak
        fiyat noktalaridir; hicbiri bir siparis, bir pilot hacmi veya bir yillik
        hedef olarak raporlanamaz. Pilot hacmi (D-09 / D-10) HALA SECILMEMISTIR.

