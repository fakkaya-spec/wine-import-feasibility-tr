# DUYARLILIK EKSENLERİ — her biri min/base/max
# ------------------------------------------------------------
duyarlilik_eksenleri:
  - eksen: FX
    min: null
    base: null
    max: null
    status: UNKNOWN
    kaynak_dosya: makro.yaml

  - eksen: FREIGHT
    min: null
    base: null
    max: null
    status: UNKNOWN
    kaynak_dosya: lojistik.yaml

  - eksen: OTV
    min: null
    base: null                          # BASE SECILMEDI — baskan sayi uretmez
    max: null
    status: UNKNOWN
    kaynak_dosya: vergi.yaml
    notes: "Maktu OTV artisi f/p segmentte en oldurucu tek degiskendir."
    # ---- TUR 2.5 PRE-FLIGHT EKI (2026-08-10) ----
    # min/base/max BILINCLI OLARAK `null` BIRAKILDI. Baskan bu sayilari
    # DOLDURMAZ. Asagidaki senaryo noktalari BASKANIN TAHMINI DEGILDIR —
    # T-104'te gumruk-vergi-uzmani tarafindan TALEP EDILMIS duyarlilik setidir
    # ve buraya ajanin talebi olarak, kaynak gosterilerek AKTARILMISTIR.
    talep_edilen_senaryo_noktalari:
      kaynak_ticket: T-104
      kaynak_ajan: gumruk-vergi-uzmani
      birim: "% artis / 6 ay (Ocak-Temmuz revizyonu basina)"
      noktalar: [0, 8, 16, 25]
      status: ASSUMPTION
      gerekce: >-
        Gelecekteki Yi-UFE BILINMEZ. 16 noktasinin tarihsel bir capasi vardir
        (2025-12-31 -> 2026-07-03 arasi gerceklesen +%16,09; EV-2026-08-09-112 ->
        EV-2026-08-09-111). Diger uc nokta CAPASIZDIR ve saf duyarlilik
        noktasidir. HICBIRI bir TAHMIN DEGILDIR.
      uygulama_kurali: >-
        Dort nokta AYRI AYRI calistirilir; ortalamasi ALINMAZ; bir tanesi
        "beklenen" diye sunulamaz. Cikti "PROJEKSIYON (ASSUMPTION)" etiketiyle
        basilir ve ASLA FACT olarak raporlanmaz
        (vergi.yaml -> otv_maktu_zaman_serisi.engine_okuma_kurali adim 3).
      capraz_carpim_zorunlulugu: >-
        Bu eksen tarih_senaryolari ile CAPRAZ calistirilir:
        3 tarih (EARLY/BASE/LATE) x 4 artis noktasi. EARLY ve LATE sinir
        tarihleri oldugu icin ikisinde de iki rejim ihtimali ayri ayri
        gosterilir. Tek bir OTV sayisi UREITLEMEZ.
      makro_bagi: >-
        Yi-UFE varsayimi makro.yaml'da HALA YOKTUR (T-104 ikinci ayagi,
        acik). Bu blok o boslugu KAPATMAZ; yalnizca ekseni tanimlar.

  - eksen: PRICE
    min: null
    base: null
    max: null
    status: UNKNOWN
    kaynak_dosya: kanal.yaml

