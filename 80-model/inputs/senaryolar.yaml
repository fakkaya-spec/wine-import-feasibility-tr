# SENARYOLAR
# Sahibi: finans-fizibilite
#
# Hacim senaryolari charter tarafindan BELIRLENMISTIR (uydurma degildir).
# Diger senaryo parametreleri TUR 1-2 sonrasi kanitla doldurulur.

meta:
  dosya: senaryolar.yaml
  son_guncelleme: 2026-08-10
  tur: "TUR 0 kurulum (2026-08-09) + TUR 2.5 PRE-FLIGHT YATIRIMCI GIRDISI (2026-08-10)"
  durum: HACIMLER_BELIRLI_YATIRIMCI_HEDEFLERI_KAYDEDILDI
  baskan_mudahalesi_tur25:
    tarih: 2026-08-10
    yazan: yatirim-komitesi-baskani
    kapsam: >-
      Iki YATIRIMCI GIRDISI kaydedildi: (a) tarih_senaryolari (EARLY/BASE/LATE),
      (b) hedef_raf_fiyati_merdiveni (599/699/799/899/999 TL, KDV DAHIL).
      IKISI DE ARASTIRMA BULGUSU DEGILDIR ve FACT DEGILDIR.
      Hicbir mevcut alan silinmemis veya degistirilmemistir.
    ref: 90-karar/tur-25-preflight.md
    acilan_ticketlar: [T-921, T-922, T-923]
  baskan_mudahalesi_tur325:
    tarih: 2026-08-10
    yazan: yatirim-komitesi-baskani
    kapsam: >-
      IKI KURUCU KARARI KAYDEDILDI: (a) hedef raf fiyati merdiveninde ROL
      ATAMASI (799 PRIMARY / 699 SECONDARY / 899 STRETCH / 599 DOWNSIDE-FLOOR
      TEST / 999 UPPER SEGMENT TEST), (b) RFQ HACIM KADEMELERI
      (5.000 / 10.000 / 25.000 / 50.000 sise + FULL_20FT ayri fiyat;
      100.000 ilk RFQ'da SORULMAYACAK).
      Ucuncu kurucu karari (DIS TEMAS POLITIKASI) bu dosyaya GIRMEZ; karsiligi
      P-6 kapisi ve T-467 / T-304 / T-884 / T-967 / T-968 ticket'laridir.
      HICBIRI ARASTIRMA BULGUSU DEGILDIR, HICBIRI FACT DEGILDIR.
      Hicbir mevcut alan silinmemis, degistirilmemis veya yeniden
      etiketlenmemistir.
    ref: 90-karar/investor-kararlari-tur325.md
    acilan_ticketlar: [T-961, T-962, T-963, T-964, T-965, T-966, T-967, T-968]

