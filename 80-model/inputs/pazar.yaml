#        maliyeti ve fiyat merdiveni HESABI bu dosyanın kapsamı DIŞINDADIR
#        (kanal-marj-uzmani / finans-fizibilite alanı).
#
# TUR 1.5 NOTU:
#   Bu dosya T-903 (yatirim-komitesi-baskani) ile talep edilmiştir. İçeriği
#   60-pazar/rapor-tur1-turkiye-pazar.md §5 tablosudur; TUR 1.5'te YENİ pazar
