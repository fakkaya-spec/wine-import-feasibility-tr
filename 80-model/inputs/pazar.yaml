# =====================================================================
# BAĞLAYICI KATMAN KURALLARI
# (başkan onayı: 90-karar/tur-1-kanit-kalitesi-denetimi.md §2.4 + T-903)
# BU KURALLAR MODELİ BAĞLAR. Okumadan bu dosyadan sayı alınamaz.
# =====================================================================
katman_kurallari:
  K1: >
    L8_METRO_CASH_CARRY != L8_CHAIN_RETAIL. İkisi hiçbir hesapta birbirinin
    yerine geçemez. L8_CHAIN_RETAIL ayrı bir alandır ve null + UNKNOWN durur.
  K2: >
    L8_METRO_CASH_CARRY L7 OLARAK DA KULLANILAMAZ. Gerçek L7
    (retailer purchase price) ithalatçı-perakendeci pazarlığından doğar;
    Metro rafından okunan bir sayı L7 proxy'si olarak modele giremez.
    L7'yi kanal-marj-uzmani kendi kanıtıyla kuracaktır.
  K3: >
    Ters model (target shelf price -> max EXW/FOB) hedefini
    L8_METRO_CASH_CARRY'ye kurarsa, bunun DAHA AGRESİF bir hedef olduğu
    model çıktısında AÇIKÇA yazılır. Cash & carry formatı yapısı gereği
    zincir perakendeden ucuzdur.
  K4: >
    Bu dosyadaki hiçbir sayı bir MARJ değildir ve marj türetmek için
    kullanılamaz. Metro 599,90 ile uzman perakende 875 TL arasındaki fark
    bu ajan tarafından KASTEN hesaplanmamıştır (kanal marjı mı, segment
    farkı mı bilinmiyor) -> T-506.

