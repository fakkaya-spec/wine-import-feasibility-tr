# ------------------------------------------------------------
# MODEL ICIN HESAP FONKSIYONU TANIMI (engine bu siraya uyar)
# ------------------------------------------------------------
hesap_sozlesmesi:
  girdi: ["cif_try", "hacim_litre", "mense", "odeme_sekli"]
  adimlar:
    - "gv = cif_try * gumruk_vergisi_oranlari_by_mense[mense].oran_pct / 100"
    - "igv = 0"
    - "kkdf = 0 if odeme_sekli == 'pesin' else UNKNOWN_MATRAH * 0.06"
    - "otv_matrahi = cif_try + gv + igv + kkdf"
    - "otv = max(otv_matrahi * 0.00, 71.2692 * hacim_litre)"
    - "kdv_matrahi = cif_try + gv + igv + kkdf + otv"
    - "kdv = kdv_matrahi * 0.20"
    - "L4 = cif_try + gv + igv + kkdf + otv + kdv"
  cikti: ["gv", "igv", "kkdf", "otv", "kdv", "L4"]
  uyari: >-
    Bu sozlesme metindir, kod degildir. engine/ altindaki kod oranlari BU DOSYADAN
    okumalidir. odeme_sekli 'pesin' degilse model KKDF matrahi UNKNOWN oldugu icin
    UNKNOWN donmelidir.
