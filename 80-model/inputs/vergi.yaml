        kural: >-
          KDV L4'te gosterilir, L5'e TASINMAZ; ancak peak_cash_requirement hesabina
          TAM TUTARIYLA girer. Bu iki sayi ayni degildir ve toplanmaz.
      - kod: C3
        kural: >-
          Devreden KDV'nin FINANSMAN MALIYETI (devreden x finansman_orani x sure)
          L5'te GERCEK bir maliyettir ve modelde AYRI SATIR olmalidir.
          finansman_orani bu dosyanin alani degildir (makro.yaml).
      - kod: C4
        kural: >-
          KDV ve OTV ayni "vergi yuku" satirinda toplanip P&L'e yazilamaz.
          Ekonomik vergi yuku = GV + KKDF + OTV. KDV bir FINANSMAN kalemidir.
      - kod: C5
        kural: >-
          fire/zayi olan mal orani f ise, f x kdv_per_sise GERCEK ekonomik maliyettir
          (KDVK md.30/c). f girdisi lojistik.yaml'dan gelir; burada tanimlanmaz.
    peak_cash_requirement_sozlesmesi: >-
      her t icin:
        nakit_cikis(t)  = KDV_ithal(t) + GV(t) + OTV(t) + KKDF(t) + diger
        devreden(t)     = max(0, devreden(t-1) + KDV_ithal(t) - hesaplanan_KDV(t))
        geri_kazanim(t) = min(devreden(t-1) + KDV_ithal(t), hesaplanan_KDV(t))
                          -> beyanname_gunu'nde realize olur
      peak_cash_requirement = max_t ( devreden(t) + kalici_vergiler_kumulatif(t)
                                      + isletme_sermayesi(t) )

