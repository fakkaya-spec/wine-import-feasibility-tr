    # ---- ENGINE ICIN BAGLAYICI KURALLAR ----
    engine_kurallari:
      - kod: C1
        kural: >-
          Devreden KDV HICBIR KOSULDA nakit iade satiri olarak modellenmez (KDVK md.29/2).
          Yalnizca gelecek donem HESAPLANAN KDV'sinden mahsup edilir.
