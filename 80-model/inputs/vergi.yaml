        L4 244,14 -> 268,14 TL, yani +24,00 TL/sise (CIF'in %24'u).
    dogrudan_nakliyat_saglandi:
      varsayilan: true
      status: ASSUMPTION
      duyarlilik_zorunlu_mu: true
      gerekce: >-
        Konsolidasyon/aktarma rotasi cikis ulkesi kontrolunu dusurebilir (T-163).
        Bu bir NAVLUN karari gibi gorunur ama VERGI sonucu dogurur.

  # ---- SARAPTA UYGULANMAYAN REJIMLER (NEGATIF BULGULAR) ----
