        beklenen_cif_try_max: 97.6987
      - kod: TV-2
        girdi: {L4_econ_max: 200.0000, gv_orani: 0.70}
        beklenen_cif_try_max: 86.2048
      - kod: TV-3
        kontrol: "TV-2 / TV-1 == 0.88235  (= 1.50/1.70)"
      - kod: TV-4
        kontrol: "kdv_ithal == 40.0000 her iki mensede — MENSEDEN BAGIMSIZ (= 0.20 x L4_econ_max)"
      - kod: TV-5
        kontrol: "L4_cash == 240.0000 == 1.20 x L4_econ_max"
      - kod: TV-6
        kod_tipi: HATA_TESTI
        hata: H1
        yanlis_sonuc: 79.8814
        dogru_sonuc: 97.6987
      - kod: TV-7
        kod_tipi: HATA_TESTI
        hata: H1
        yanlis_sonuc: 64.1952
        dogru_sonuc: 86.2048
      - kod: TV-8
        kod_tipi: HATA_TESTI
        hata: H3
        yanlis_sonuc: 75.4765
        dogru_sonuc: 97.6987
      - kod: TV-9
        girdi: {odeme_sekli: "mal mukabili", gv_orani: 0.50}
        beklenen: UNKNOWN
        not: "KKDF matrahi UNKNOWN (T-105) — model SAYI URETMEZ"
      - kod: TV-10
        girdi: {t: 2027-04-01, otv_assumption_var_mi: false}
        beklenen: "97.6987 + ZORUNLU UPPER_BOUND etiketi (O-2/O-3/O-5)"
        not: "Etiket yoksa cikti GECERSIZDIR"
    kritik_not: "TV-9 ve TV-10 'model uydurmaz' kilidinin testleridir (CLAUDE.md §12)."
