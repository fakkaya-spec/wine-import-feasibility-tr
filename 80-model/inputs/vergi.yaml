  # ---- ENGINE ICIN BAGLAYICI OKUMA KURALI ----
  engine_okuma_kurali: >-
    gv(mense, cif_try) hesabi:
      1) mense_tarife_eslemesi.ulkeler icinde country == mense kaydini bul.
         Bulunamazsa -> DU fallback (%70) uygula ve ciktida "DU FALLBACK" etiketle.
      2) EGER kayit.preferential_regime == null ISE -> oran = kayit.applicable_customs_rate.
      3) EGER kayit.preferential_regime != null ISE oran KOSULLUDUR:
           tercihli_belge_ibraz_edildi == true VE dogrudan_nakliyat_saglandi == true
             -> oran = kayit.applicable_customs_rate
           AKSI HALDE
             -> oran = tercihli_tarife.mense_ispat_belgesi_yoksa_uygulanan_oran (=70)
      4) gv = cif_try * oran / 100
      5) Ciktida kullanilan country, oran, kosul durumu ve evidence_id YAZILIR.
  senaryo_degiskenleri:
    # BUNLAR VERGI VERISI DEGILDIR — SENARYO GIRDISIDIR. Sahibi: finans-fizibilite.
    tercihli_belge_ibraz_edildi:
      varsayilan: true
      status: ASSUMPTION
      duyarlilik_zorunlu_mu: true
      gerekce: >-
