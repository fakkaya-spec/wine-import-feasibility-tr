# ------------------------------------------------------------
# MODEL ICIN HESAP FONKSIYONU TANIMI (engine bu siraya uyar)
# ------------------------------------------------------------
hesap_sozlesmesi:
  # ---- T-906 (b) DUZELTMESI — 2026-08-10 ----
  # ONCEKI HALI: adimlar metninde 71.2692 ve 0.20 LITERAL olarak tekrar ediyordu.
  # DESENKRONIZASYON RISKI: OTV Ocak/Temmuz'da degistiginde iki yerde guncelleme gerekiyordu.
  # DUZELTME: tum literaller ALAN REFERANSINA cevrildi. Bu dosyada bir oran/tutar
  # ARTIK YALNIZCA TEK BIR YERDE yasar (matrah_sirasi[*]).
  girdi: ["cif_try", "hacim_litre", "mense", "odeme_sekli"]
  adimlar:
    - "gv          = cif_try * gumruk_vergisi_oranlari_by_mense[mense].oran_pct / 100"
    - "igv         = cif_try * matrah_sirasi[sira=2].oran_pct / 100"
    - "kkdf        = 0 if odeme_sekli == 'pesin' else UNKNOWN_MATRAH * matrah_sirasi[sira=3].oran_pct / 100"
    - "otv_matrahi = cif_try + gv + igv + kkdf"
    - "otv         = max( otv_matrahi * matrah_sirasi[sira=4].oran_pct / 100 ,
                          matrah_sirasi[sira=4].asgari_maktu_tutar * hacim_litre )"
    - "kdv_matrahi = cif_try + gv + igv + kkdf + otv"
    - "kdv         = kdv_matrahi * matrah_sirasi[sira=5].oran_pct / 100"
    - "L4          = cif_try + gv + igv + kkdf + otv + kdv"
  # ---- KATMAN VE PERSPEKTIF AYRIMI (CLAUDE.md §6) ----
  turev_ciktilar:
    - "ekonomik_vergi_yuku = gv + igv + kkdf + otv        # KDV DAHIL DEGIL — L5'e tasinan kisim"
    - "kdv_nakit_cikisi    = kdv                          # L5'e TASINMAZ, peak_cash'e girer"
    - "kdv_ekonomik_maliyet = 0                           # A1 baz senaryo (EV-2026-08-10-101)"
    - "kdv_ekonomik_maliyet_A2 = kdv                      # YALNIZCA K1..K4 kosullarinda"
    - "kdv_fire_maliyeti   = fire_orani * kdv             # KDVK md.30/c — fire_orani lojistik.yaml'dan"
  cikti: ["gv", "igv", "kkdf", "otv", "kdv", "L4",
          "ekonomik_vergi_yuku", "kdv_nakit_cikisi", "kdv_ekonomik_maliyet"]
  uyari: >-
    Bu sozlesme METINDIR, kod degildir. engine/ altindaki kod TUM oranlari ve tutarlari
    BU DOSYADAN okur; hicbir oran/tutar kodda hard-code edilmez (CLAUDE.md §12).
    odeme_sekli 'pesin' degilse model KKDF matrahi UNKNOWN oldugu icin UNKNOWN donmelidir.
    L4 icinde KDV VARDIR; L5'e gecerken KDV DUSULUR (A1 baz senaryo). Bu gecis
    cikti raporunda ACIKCA gosterilmelidir.
  tarih_kurali: >-
    Model calistirilirken hangi tarih setinin kullanildigi ciktida yazilir:
    model_hedef_tarihi == TBD ise cikti "BASE_DATE 2026-08-10 mevzuatiyla" etiketlenir
    ve GELECEK OTV/kur TAHMINI YAPILMAZ.
