# ------------------------------------------------------------
# OTV ASGARI MAKTU TUTARI — ZAMAN ENDEKSLI TEMSIL
# TUR 2 / ticket T-104 (CRITICAL, target: finans-fizibilite)
# ------------------------------------------------------------
# NEDEN VAR: OTVK md.12/3 uyarinca (III) sayili listedeki asgari maktu tutarlar
# OCAK ve TEMMUZ aylarinda TUIK Yi-UFE'nin son 6 aylik degisimi oraninda, AYRI BIR
# KARARA GEREK OLMAKSIZIN "yeniden belirlenmis sayilir" (EV-2026-08-09-114, T1).
# Bu nedenle OTV modelde TEK BIR SABIT SAYI olarak tutulamaz.
#
# BU BLOK BIR TAHMIN DEGILDIR. Yalnizca DOGRULANMIS gozlemleri ve engine'in bu
# gozlemleri NASIL OKUYACAGINI tanimlar. GELECEK DEGER BU DOSYAYA YAZILMAZ.
otv_maktu_zaman_serisi:
  gtip: "22.04"
  birim: "TRY/litre"
  para_birimi: TRY
  dayanak: "4760 s. OTVK md.12/3 — Ocak ve Temmuz, TUIK UFE son 6 ay degisimi, kendiliginden"
  dayanak_evidence_id: EV-2026-08-09-114
  dayanak_tier: T1
  guncelleme_aylari: [1, 7]

  # ---- GOZLENEN DEGERLER: yalnizca T1/T2 ile DOGRULANMIS, GERCEKLESMIS tutarlar ----
  gozlenen_degerler:
    - effective_date: 2025-12-31
      value: 61.3914
      status: SUPERSEDED
      tier: T1
      evidence_id: EV-2026-08-09-112
    - effective_date: 2026-07-03
      value: 71.2692
      status: FACT
      tier: T2
      evidence_id: EV-2026-08-09-111
      ttl: 30d
      stale_tarihi: 2026-09-08

  # ---- GECERLILIK UFKU: bu tarihten sonrasi icin DOGRULANMIS deger YOKTUR ----
  son_gozlem_gecerlilik_ufku: 2026-12-31
  son_gozlem_gecerlilik_ufku_gerekcesi: >-
    2026-07-03 tutari, bir sonraki otomatik guncellemeye (beklenen: Ocak 2027) kadar
    gecerlidir. Cumhurbaskani md.12/3'un uygulanmamasina karar verebilir; boyle bir
    karar CIKARSA tutar degismez. Iki ihtimalin hangisinin gerceklesecegi BILINMEZ.

  gelecek_degerler: null
  gelecek_deger_status: UNKNOWN
  gelecek_deger_kurali: >-
    GELECEK OTV TUTARI BU DOSYAYA YAZILMAZ (BASE_DATE_kurali). Projeksiyon gerekiyorsa
    artis varsayimi makro.yaml'da (Yi-UFE) ASSUMPTION olarak tutulur ve senaryolar.yaml'da
    bir DUYARLILIK EKSENI olarak calistirilir. vergi.yaml yalnizca GERCEKLESMIS tutari
    tasir. Tarihsel referans (TAHMIN DEGIL): 2025-12-31 -> 2026-07-03 arasi +%16,09.

  # ---- ENGINE ICIN BAGLAYICI OKUMA KURALI ----
  engine_okuma_kurali: >-
    otv_maktu(t) fonksiyonu:
      1) t = model_hedef_tarihi; t null/TBD ise t = meta.BASE_DATE.
      2) gozlenen_degerler icinde effective_date <= t olan EN SON kaydi sec.
      3) EGER t > son_gozlem_gecerlilik_ufku ISE:
           - senaryolar.yaml'da acik bir OTV artis ASSUMPTION'i TANIMLI DEGILSE
             -> engine UNKNOWN doner ve eksik girdiyi 'otv_maktu_zaman_serisi.gelecek_degerler'
                olarak raporlar (CLAUDE.md §12: uydurmaz).
           - TANIMLI ISE -> tutar SENARYO cikitisidir, cikti "PROJEKSIYON (ASSUMPTION)"
             etiketiyle basilir ve ASLA FACT olarak raporlanmaz.
      4) otv_per_sise = otv_maktu(t) * urun_parametreleri.sise_hacmi_litre
      5) Cikti raporunda kullanilan effective_date ve evidence_id ZORUNLU olarak yazilir.
  engine_yasak: >-
    matrah_sirasi[sira=4].asgari_maktu_tutar alani BU SERININ 2026-07-03 KAYDININ
    KISAYOLUDUR ve geriye donuk uyumluluk icin durur. Cok donemli / t > 2026-12-31
    hesaplarda engine BU ALANI DEGIL, otv_maktu_zaman_serisi'ni okumak ZORUNDADIR.
    Iki alan CELISIRSE otv_maktu_zaman_serisi esas alinir.
  antrepo_etkilesimi: >-
    Vergi, serbest dolasima giris beyannamesinin TESCIL tarihinde dogar (EV-2026-08-09-122).
    Antrepoda 1 Ocak veya 1 Temmuz'u gecirmek, t'yi bir sonraki basamaga tasiyarak
    sise basina OTV'yi yukseltir. Bu, antreponun nakit avantajinin KARSI RISKIDIR ve
    peak_cash_requirement optimizasyonunda AYRI bir kalem olarak gorunmelidir.

