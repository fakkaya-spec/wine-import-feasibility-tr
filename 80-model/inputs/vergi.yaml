        (b) 2204, GTS sutunu bulunan II sayili Liste'de YER ALMAZ; (c) EK-1 GTS ulkeleri
        listesinde 9 ulkenin HICBIRI yok.
      evidence_id: EV-2026-08-10-151
      destekleyici_evidence_ids: [EV-2026-08-10-153, EV-2026-08-10-154]
    moldova_sta:
      uygulanir_mi: false
      gerekce: >-
        Turkiye-Moldova STA'si VARDIR (GGM Mense Kontrol Tablosu 'MD' satiri, EUR.1/Fatura Beyani)
        ANCAK Moldova'nin I sayili Liste 21-22. Fasillar tablosunda NE SUTUNU NE DIPNOTU vardir
        -> Moldova mensei 2204.21 sarap %70 oder. EFTA ile AYNI YAPISAL DURUM.
        Romanya ve Bulgaristan AB uyesidir -> %50.
      evidence_id: EV-2026-08-10-165
      kapsam_notu: >-
        Moldova, charter'daki 9 ulkelik kapsamin DISINDADIR ve mense_tarife_eslemesi.ulkeler
        listesinde SATIRI YOKTUR. Bu kayit, 50-sourcing/supplier-priority-ranking.md B onceliginde
        Purcari (MD) bulundugu icin acilmistir. Kapsam genisletilirse ulkeler listesine
        country: MD / applicable_customs_rate: 70 / preferential_regime: null olarak EKLENIR.
    efta_sta:
      uygulanir_mi: false
      gerekce: >-
        Turkiye'nin ILK STA'sidir (1992) ancak 2204.21 icin I sayili Liste'de ne sutunu
        ne dipnotu vardir -> %70. Dipnot (5) yalnizca 2208.90.91/99 satirlarinda Norvec ve
        Izlanda'ya AB oranini verir. "STA var = indirim var" varsayimini AYNI TABLO ICINDE
        curuten kanit. Tek istisna: Isvicre/Lihtenstayn 30.000 lt/yil tarife kontenjani @ %35.
      evidence_id: EV-2026-08-10-164
      destekleyici_evidence_ids: [EV-2026-08-09-109]

