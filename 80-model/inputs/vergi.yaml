# VERGİ GİRDİLERİ
# Sahibi: gumruk-vergi-uzmani
#
# ============================================================
#  GÜVENLİK KİLİDİ — BU DOSYA MODELİN EN TEHLİKELİ YERİDİR
# ============================================================
#
# HİÇBİR ORAN, TUTAR VEYA MATRAH TANIMI
# T1/T2 RESMÎ KAYNAKLA (A1 SEVİYESİNDE) DOĞRULANMADAN YAZILMAZ.
#
# - Hatirlanan oran yazilmaz.
# - "Genelde su kadardir" yazilmaz.
# - T5 (blog/forum/LLM hafizasi) TEK BASINA yeterli DEGILDIR.
# - Her deger icin effective_date ZORUNLUDUR.
# - engine/ altindaki kod bu dosyadan okur; kodda oran HARD-CODE EDILMEZ.
#
# Bu dosya doldurulmadan finans modeli vergi hesabi CALISTIRMAZ.
# Eksik girdi ile calistirilirsa model UNKNOWN doner ve eksik listesini basar.
#
# Kaynak: 30-vergi-gumruk/matrah-sirasi.md (tek dogruluk kaynagi)

meta:
  dosya: vergi.yaml
  son_guncelleme: 2026-08-10
  tur: "TUR 1 (2026-08-09) + TUR 1.5 BLOCKER REMEDIATION (2026-08-10) + TUR 2 MENSE-TARIFE ESLEMESI (2026-08-10) + TUR 2.5 PRE-FLIGHT YATIRIMCI GIRDISI (2026-08-10)"
  durum: KISMEN_DOLDURULDU
  # TUR 2.5 PRE-FLIGHT'ta baskan tarafindan DOKUNULAN TEK YERLER:
  #   (1) meta.model_hedef_tarihi* — yatirimci girdisi kaydedildi (INVESTOR_ASSUMPTION)
  #   (2) meta.tarih_senaryolari   — YENI blok (EARLY/BASE/LATE, TUTAR ICERMEZ)
  #   (3) otv_maktu_zaman_serisi.epistemik_ayrim — YENI blok (yalnizca etiket)
  # HICBIR VERGI ORANI, TUTARI VEYA MATRAH TANIMI DEGISTIRILMEMISTIR.
  # otv_maktu_zaman_serisi'nin mevcut yapisi BOZULMAMISTIR.
  baskan_mudahalesi_tur25:
    tarih: 2026-08-10
    kapsam: "YATIRIMCI GIRDISI + ETIKET. Vergi degeri degisikligi YOK."
    ref: 90-karar/tur-25-preflight.md
    acilan_ticket: T-921
  a1_dogrulama_yapildi_mi: true
  a1_notu: >-
    Gumruk vergisi, OTV (oran + asgari maktu + birim + hesap kurali), KDV orani ve
    matrahi, KKDF orani, gumruk kiymeti unsurlari ve vergi dogus ani T1/T2 ile
    dogrulandi. TUR 1.5'te ITHALAT KDV'SININ INDIRILEBILIRLIGI T1 ile KAPATILDI
    (KDVK md.29/1-b, md.34/1, md.30 tam metin; EV-2026-08-10-101/-102/-103).
    TUR 2'de MENSE -> TARIFE ESLEMESI ve MENSE ISPAT BELGESI kapatildi
    (mense_tarife_eslemesi blogu; EV-2026-08-10-151..-164). Ayrica OTV'nin zaman
    endeksli temsili tanimlandi (otv_maktu_zaman_serisi; ticket T-104).
    KKDF matrahi, gozetim, antrepo kismi cekis, fiili vergilendirme donemi,
    damga vergisi ve fatura beyani deger esigi UNKNOWN olarak kalmistir.

  # ============================================================
  #  IKI AYRI TARIH — KARISTIRILMAZ
  # ============================================================
  #
  # BASE_DATE ve model_hedef_tarihi AYNI SEY DEGILDIR.
  #
  #  BASE_DATE           = "Bugun hangi mevzuat yururlukte?"  -> DOGRULANMIS OLGU
  #  model_hedef_tarihi  = "Ilk konteyner ne zaman gumrukten cikacak?" -> YATIRIMCI GIRDISI
  #
  BASE_DATE: 2026-08-10
  BASE_DATE_kurali: >-
    BASE_DATE senaryosunda YALNIZCA 2026-08-10 tarihinde YURURLUKTE OLAN ve
    T1/T2 ile DOGRULANMIS vergi/mevzuat degerleri kullanilir.
    GELECEK OTV, KUR VEYA MEVZUAT TAHMINI YAPILMAZ VE BU DOSYAYA YAZILMAZ.
    OTV'nin Ocak/Temmuz'da Yi-UFE ile artacagi bilgisi (EV-2026-08-09-114) bir
    RISK NOTUDUR, bir TAHMIN GIRDISI DEGILDIR. BASE_DATE altina gelecek deger
    yazilamaz; boyle bir deger gerekirse ayri bir senaryo dosyasinda ve
    ASSUMPTION etiketiyle tutulur (senaryolar.yaml).
  BASE_DATE_kapsami:
    - "matrah_sirasi[*] (GV, IGV, KKDF, OTV, KDV) — 2026-08-10 itibariyla yururlukte"
    - "gumruk_vergisi_oranlari_by_mense — Ithalat Rejimi Karari 2026, eff 2026-01-01"
    - "otv.asgari_maktu_tutar = 71.2692 TL/lt — eff 2026-07-03 (EV-2026-08-09-111)"
    - "kdv.oran_pct = 20 — eff 2023-07-10 (EV-2026-08-09-118)"
    - "kdv_perspektifleri.* — KDVK konsolide metin, TUR 1.5 kanitlari"
  BASE_DATE_disinda_kalan:
    - "7524 s.K. md.30/(f) 5 takvim yili devreden KDV siniri — eff 2030-01-01 -> BASE_DATE'te YURURLUKTE DEGIL"
    - "2027-01 ve sonrasi OTV tutarlari -> BILINMIYOR, YAZILMAZ"

  # OQ-002 / OQ-G08 — YATIRIMCI GIRDISI. Bu ajanin alani DEGIL, DOLDURULMAZ.
  #
  # ---- ONCEKI HALI (2026-08-09 -> 2026-08-10 TUR 2 SONU) ----
  #   model_hedef_tarihi: null
  #   model_hedef_tarihi_durum: TBD
  #   model_hedef_tarihi_status: UNKNOWN
  # Gerekce (korunur): DEGER "TBD"YDI. CLAUDE.md §12 eksik girdinin `null` +
  # `UNKNOWN` olarak durmasini emrettigi ve 80-model/engine/matrah_sirasi.py:217
  # bu alani `is None` ile denetledigi icin TBD durumu `null` + ayri bir durum
  # alani ile temsil edilmisti. Literal "TBD" string'i yazilsaydi engine'in
  # guvenlik kontrolu SESSIZCE GECERDI. Bkz. ticket T-153.
  #
  # ---- TUR 2.5 PRE-FLIGHT (2026-08-10, yatirim-komitesi-baskani) ----
  # KURUCU/YATIRIMCI GIRDISI KAYDEDILDI. Bu bir ARASTIRMA BULGUSU DEGILDIR ve
  # bir FACT DEGILDIR. Bir YATIRIMCI VARSAYIMIDIR ve oyle etiketlenmistir.
  # Alani dolduran gumruk-vergi-uzmani DEGIL, baskandir; ajanin "doldurmam"
  # karari DOGRULANMISTIR ve ihlal edilmemistir.
  #
  # ⚠ BU DEGERIN DOLDURULMASI MODELI DAHA GUVENLI YAPMAZ — DAHA TEHLIKELI YAPAR.
  # Cunku engine (matrah_sirasi.py:217) yalnizca `is None` denetler; bu alan
  # dolduktan sonra o uyari SUSAR. Engine su anda otv_maktu_zaman_serisi'ni
  # HIC OKUMAMAKTADIR (dogrulandi: 80-model/engine/*.py icinde tek referans yok).
  # 2027-04-01 > son_gozlem_gecerlilik_ufku (2026-12-31) oldugu icin ENGINE'IN
  # UNKNOWN DONMESI ZORUNLUDUR. Bkz. ticket T-921 (CRITICAL) — bu ticket
  # kapanmadan hicbir OTV sayisi uretilemez.
  model_hedef_tarihi: 2027-04-01
  model_hedef_tarihi_durum: KAYDEDILDI
  model_hedef_tarihi_status: INVESTOR_ASSUMPTION     # FACT DEGILDIR
  model_hedef_tarihi_kaynak: "kurucu/yatirimci beyani — TUR 2.5 PRE-FLIGHT, 2026-08-10"
  model_hedef_tarihi_kayit_belgesi: 90-karar/tur-25-preflight.md
  model_hedef_tarihi_evidence_id: null              # BIR DIS OLGU DEGILDIR -> kanit karti YOKTUR
  model_hedef_tarihi_oq: OQ-002                     # KAPANMADI -> INPUT_RECORDED
  model_hedef_tarihi_notu: >-
    2027-04-01 bir OLCUM veya TURETME degil, bir YATIRIMCI BEYANIDIR. Duyarlilik
    ZORUNLUDUR: tarih_senaryolari bloğundaki EARLY / BASE / LATE senaryolarinin
    UCU DE ayri ayri calistirilir. BASE tek sonuc olarak sunulamaz. Tarih
    degisirse bu alan degistirilir; OTV hicbir yerde sabitlenmez.
  model_hedef_tarihi_uyarisi: >-
    OTV maktu tutari Ocak ve Temmuz aylarinda Yi-UFE ile otomatik guncellenir
    (EV-2026-08-09-114, T1). 2027-04-01 tarihinde yururlukte olacak OTV tutari
    BILINMIYOR ve BU DOSYAYA YAZILAMAZ (BASE_DATE_kurali). Bilinen TEK gercek
    deger 71,2692 TL/lt'dir (eff 2026-07-03, EV-2026-08-09-111) ve gecerliligi
    2026-12-31'de biter. Model bu tarih icin OTV'yi ancak PROJEKSIYON
    (ASSUMPTION) etiketiyle ve senaryolar.yaml -> duyarlilik_eksenleri[OTV]
    uzerinden uretebilir; FACT olarak ASLA raporlayamaz.

  # ============================================================
  #  TARIH SENARYOLARI — YATIRIMCI GIRDISI (TUR 2.5)
  # ============================================================
  # Ucu de AYRI AYRI calistirilir. Ortalamasi ALINMAZ. BASE tek sonuc DEGILDIR.
  # Her uc tarih de son_gozlem_gecerlilik_ufku'nun (2026-12-31) OTESINDEDIR:
  # UCUNDE DE dogrulanmis OTV tutari YOKTUR.
  tarih_senaryolari:
    status: INVESTOR_ASSUMPTION
    kaynak: "kurucu/yatirimci beyani — TUR 2.5 PRE-FLIGHT, 2026-08-10"
    kural: >-
      Bu blok TARIH tasir, TUTAR TASIMAZ. Hicbir senaryonun altina gelecek OTV
      tutari yazilamaz (BASE_DATE_kurali). Tutar yalnizca senaryolar.yaml
      duyarlilik ekseni uzerinden PROJEKSIYON olarak uretilir.
    senaryolar:
      - id: EARLY
        tarih: 2027-01-01
        otv_rejimi: "OCAK 2027 revizyonu — SINIR TARIHI, BELIRSIZ"
        otv_rejimi_status: UNKNOWN
        otv_tutari: null
        otv_tutari_status: FUTURE_UNKNOWN
        sinir_riski: true
        notes: >-
          GOZLENEN DESEN DUZENSIZDIR: onceki tutar 2025-12-31'de, guncel tutar
          2026-07-03'te yururluge girmistir — yani revizyonlar 1 Ocak / 1 Temmuz
          tarihlerine BIREBIR OTURMAZ (OTVK md.12/3 "degisimin ilani gununden
          gecerli olmak uzere" der). Bu nedenle 2027-01-01, Ocak 2027 revizyonunun
          ONCESINE de SONRASINA da dusebilir. Iki farkli tutar ihtimali vardir ve
          hangisinin gecerli olacagi BILINMEZ. Modelde tek rejime kilitlenemez.
      - id: BASE
        tarih: 2027-04-01
        otv_rejimi: "OCAK 2027 revizyonu — REVIZYON KESIN YURURLUKTE"
        otv_rejimi_status: REGIME_KNOWN_AMOUNT_UNKNOWN
        otv_tutari: null
        otv_tutari_status: FUTURE_UNKNOWN
        sinir_riski: false
        notes: >-
          UC SENARYONUN ICINDE REJIM ACISINDAN TEK NET OLANIDIR: 2027-04-01, Ocak
          2027 ile Temmuz 2027 revizyonlarinin TAM ARASINDADIR ve hicbir sinira
          degmez. Hangi REJIMIN gecerli olacagi bellidir; o rejimin TUTARI
          bilinmemektedir. BASE_DATE'ten (2026-08-10) itibaren araya giren
          dogrulanmamis revizyon sayisi: 1 (Ocak 2027).
      - id: LATE
        tarih: 2027-07-01
        otv_rejimi: "TEMMUZ 2027 revizyonu — SINIR TARIHI, BELIRSIZ"
        otv_rejimi_status: UNKNOWN
        otv_tutari: null
        otv_tutari_status: FUTURE_UNKNOWN
        sinir_riski: true
        notes: >-
          2026 gozlemi (yururluk 2026-07-03) Temmuz revizyonunun ayin ILK GUNUNDE
          DEGIL, birkac gun SONRA yururluge girebildigini gosterir. Bu nedenle
          2027-07-01, hala OCAK 2027 rejiminde olabilir. Araya giren dogrulanmamis
          revizyon sayisi: 1 VEYA 2. Bu senaryo AYNI ANDA iki rejim altinda
          calistirilmalidir.
    baglayici_kural: >-
      Uc senaryonun UCU DE > son_gozlem_gecerlilik_ufku'dur. Bu nedenle
      otv_maktu_zaman_serisi.engine_okuma_kurali adim 3 UCUNDE DE devrededir:
      senaryolar.yaml'da acik bir OTV artis ASSUMPTION'i secilmeden engine
      UNKNOWN DONMEK ZORUNDADIR. model_hedef_tarihi'nin dolu olmasi bu
      zorunlulugu KALDIRMAZ.
    yasak: >-
      CURRENT_CONFIRMED (71,2692 TL/lt, eff 2026-07-03, EV-2026-08-09-111)
      degeri bu uc tarihin HICBIRI icin "gecerli tutar" olarak KULLANILAMAZ.
      Kullanilirsa cikti GECERSIZDIR (CLAUDE.md §1.1 + §12).

