# =====================================================================
#  ⛔⛔⛔  TEST_FIXTURE — GERÇEK GİRDİ DEĞİLDİR  ⛔⛔⛔
# =====================================================================
#
#  BU DOSYA BİR MODEL GİRDİSİ DEĞİLDİR.
#  İçindeki hiçbir sayı bir fiyat, bir marj, bir oran veya bir kanıt DEĞİLDİR.
#  Tek amacı: kanal bacağının CEBRİNİ test etmektir.
#
#  KORUMA MEKANİZMASI (üç katmanlı):
#    1) DOSYA ADI       : "TEST_FIXTURE" içerir ->
#                         kalem_defteri.guvenli_girdi_yukle() bu dosyayi REDDEDER
#                         (FixtureSizintisi istisnasi firlatir).
#    2) DEĞİŞKEN ADI    : test modulunde TEST_FIXTURE_* on ekiyle okunur.
#    3) STATUS ETİKETİ  : sentetik degerler `status: TEST_FIXTURE` tasir ->
#                         MaliyetKalemi._fixture_denetimi() uretim defterine
#                         girmesini ENGELLER.
#
#  Beklenen değerler UYDURULMAMIŞTIR: `kanal-marj-uzmani`'nın
#  70-kanal/kanal-bacagi-hata-listesi.md "BIRIM TEST VEKTORLERI" bölümünden
#  ve 70-kanal/kanal-katman-matrah-haritasi.md §6.2 gridinden BİREBİR
#  aktarılmıştır. Kaynak bir SPESİFİKASYONDUR, bir kanıt değildir.
# =====================================================================

TEST_FIXTURE: true
uretim_girdisi_mi: false
sahibi: finans-fizibilite
tur: "TUR 3A"
tarih: 2026-08-10
kaynak_spesifikasyon:
  - 70-kanal/kanal-bacagi-hata-listesi.md      # TVK-1 .. TVK-P6
  - 70-kanal/kanal-katman-matrah-haritasi.md   # §6.2 mu gridi, §9 kapali formul seti
  - 99-ops/tickets/T-619.md                    # DOGRU R8-K
yeni_evidence: "YOK — hicbir dis kaynak taranmamistir"

# ---------------------------------------------------------------------
#  TABAN
#  v, m, d : gercek girdi dosyalarindaki BASE degerlerle AYNIDIR
#            (vergi.yaml kdv=%20 FACT ; kanal.yaml m=%25, d=%8 ASSUMPTION)
#  f, F_total, mu, r, m_dist : SENTETIKTIR -> TEST_FIXTURE
# ---------------------------------------------------------------------
taban:
  L8_gross:
    value: 799.00
    status: INVESTOR_ASSUMPTION
    kaynak: "senaryolar.yaml/hedef_raf_fiyati_merdiveni (PRIMARY hedef)"
  v:
    value: 0.20
    status: FACT_MIRROR
    kaynak: "vergi.yaml/matrah_sirasi[KDV].oran_pct — BURADAN OKUNMAZ, aynadir"
  m_retail:
    value: 0.25
    status: ASSUMPTION_MIRROR
    kaynak: "kanal.yaml/duyarlilik_senaryolari.m_retail_zincir_pct.base"
  d_var:
    value: 0.08
    status: ASSUMPTION_MIRROR
    kaynak: "kanal.yaml/duyarlilik_senaryolari.d_geri_akan_bedeller_pct.base"
  TEST_FIXTURE_f_per_bottle:
    value: 6.00
    status: TEST_FIXTURE
    gerekce: "ILLUSTRATIF. kanal.yaml f_listeleme_bedeli_sise_basi = null/UNKNOWN."
  TEST_FIXTURE_f_sifir_tabani:
    value: 0.00
    status: TEST_FIXTURE
    gerekce: "TVK-P1/P2/P3 beklenen degerleri f=0 tabanindadir (reverse-price-model §9.2 ile capraz)."

