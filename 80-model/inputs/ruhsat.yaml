# RUHSAT / MEVZUAT GİRDİLERİ
# Sahibi: mevzuat-ruhsat-uzmani
#
# KURAL: evidence_id'si olmayan sayı modele GİREMEZ.
# KURAL: Sure tahmini FACT degildir — ESTIMATE veya ASSUMPTION'dir.
# Para birimi: TRY, KDV HARIC. Yil: 2026 tarifeleri (yururluk 2026-01-01).

meta:
  dosya: ruhsat.yaml
  son_guncelleme: 2026-08-10
  tur: "TUR 1 (ilk doldurma) + TUR 1.5 (yalnizca 'esikler' bolumu ve g0_onerisi guncellendi)"
  durum: KISMEN_DOLU
  para_birimi: TRY
  kdv_durumu: "Tum bedeller KDV HARIC. Bandrol fiyat listesi acikca '%20 KDV haric' der."
  tarife_yili: 2026
  uyari: >
    Ticaret Yonetmeligi m.14 ve Satis Yonetmeligi m.15 uyarinca bedeller HER YIL
    yeniden belirlenip Resmi Gazete'de yayimlanir. Ilk konteyner 2027'ye sarkarsa
    2027 tarifeleri gecerli olur. Bu bir REGULASYON TAKVIMI RISKIDIR.

g0_onerisi:
  value: G0_PASS
  status: ESTIMATE
  tier: T2
  guncelleme_turu: "TUR 1.5"
  evidence_id: [EV-2026-08-09-201, EV-2026-08-09-203, EV-2026-08-09-206, EV-2026-08-09-210, EV-2026-08-09-212,
                EV-2026-08-10-201, EV-2026-08-10-202, EV-2026-08-10-204, EV-2026-08-10-205, EV-2026-08-10-206,
                EV-2026-08-10-207, EV-2026-08-10-208, EV-2026-08-10-215, EV-2026-08-10-216]
  gerekce: >
    Incelenen T1/T2 mevzuatta Turkiye'de sarap ithalatcisi olmayi YASAKLAYAN hukum
    yoktur. Gerekli belgeler tanimli, 2026 bedelleri resmi tebliglerle bilinir ve
    buyuklukleri karsilanabilir duzeydedir (~151-253 bin TL sabit). Depo sarti
    sozlesmeli dagitim agi ile karsilanabilir.
    TUR 1.5 EKI: G0'i BLOCKED yapan tek gerekce olan T-201/C-201 (1.000.000 litre/yil
    esigi) cozulmustur - esik bir ITHALAT/DAGITIM/BEDEL esigi DEGIL, 4250 m.1/3
    metnindeki bir FIYAT BELIRLEME SERBESTISI kosuludur ve bugun uygulanan olcu
    1.000.000 degil en cok 600.000 litre/yil'dir. Bes hacim senaryosunun tamami
    (3.750-75.000 litre/yil) olcunun cok altindadir ve senaryolar arasinda ayrim
    yaratmaz. Detay: 20-mevzuat/1m-litre-esigi.md
  kosullu_mu: false
  kosulsuzluk_kapsami: "YALNIZCA T-201/C-201 boyutu icindir."
  blocked_a_cevirecek_bulgular:
    - "C-252 (LOW): 4250 m.1 son fikra muafiyetinin ithal durgun sarabi kapsamadiginin TADAB gorusuyle teyidi VE ayni anda 'Tekel GM eliyle fiyatlandirma' mekanizmasi icin bir halef merci belirlendiginin tespiti (her IKISI birden gerekir; tek basina hicbiri bloke etmez)"
    - "T-202: Dagitim yetki belgesi inceleme suresinin fiilen 6 ayi asmasi"
  baskana_uyari: >
    Bu oneri YALNIZCA T-201/C-201 boyutu icindir. C-203 / T-205 (7584 s.K. satis
    noktasi marka/ambalaj gorseli yasaginin raf kapsami) CRITICAL ve OPEN kalmaya
    devam etmektedir; TUR 1.5 mandasi geregi bu turda ELE ALINMAMISTIR. Baskan
    C-203'u G0 kapsaminda sayarsa G0 BASKA BIR GEREKCEYLE BLOCKED kalir.
  notes: >
    Bu bir ONERIDIR. Nihai karar yatirim-komitesi-baskani'na aittir.
    mevzuat-ruhsat-uzmani kendi basina KILL karari VERMEZ.

