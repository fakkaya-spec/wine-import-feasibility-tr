    notes: >
      Ithalat izni esigi DEGIL, dagitim yetkisi esigi DEGIL, teminat/bedel sinifi DEGIL.
      4250 m.1/3: esigi asan firma 'fiyat belirlemekte serbesttir'; asamayan firmanin
      urununun fiyatlandirilmasi/satisi/dagitimi 'Tekel Genel Mudurlugu eliyle' yapilir.
      Bu mekanizma ikincil mevzuata (Yonetmelik 7.5.6203) AKTARILMAMISTIR.
      HUKUKI TURETMEDIR, idari makam yorumu DEGILDIR.
  kanun_metnindeki_olcu_litre_yil:
