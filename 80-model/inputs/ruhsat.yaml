# RUHSAT / MEVZUAT GİRDİLERİ
# Sahibi: mevzuat-ruhsat-uzmani
#
# KURAL: evidence_id'si olmayan sayı modele GİREMEZ.
# KURAL: Sure tahmini FACT degildir — ESTIMATE veya ASSUMPTION'dir.
# Para birimi: TRY, KDV HARIC. Yil: 2026 tarifeleri (yururluk 2026-01-01).

meta:
  dosya: ruhsat.yaml
  son_guncelleme: 2026-08-09
  tur: "TUR 1 — mevzuat-ruhsat-uzmani ilk doldurma"
  durum: KISMEN_DOLU
  para_birimi: TRY
  kdv_durumu: "Tum bedeller KDV HARIC. Bandrol fiyat listesi acikca '%20 KDV haric' der."
  tarife_yili: 2026
  uyari: >
    Ticaret Yonetmeligi m.14 ve Satis Yonetmeligi m.15 uyarinca bedeller HER YIL
    yeniden belirlenip Resmi Gazete'de yayimlanir. Ilk konteyner 2027'ye sarkarsa
    2027 tarifeleri gecerli olur. Bu bir REGULASYON TAKVIMI RISKIDIR.

g0_onerisi:
  value: G0_PASS
  status: ESTIMATE
  evidence_id: [EV-2026-08-09-201, EV-2026-08-09-203, EV-2026-08-09-206, EV-2026-08-09-210, EV-2026-08-09-212]
  gerekce: >
    Incelenen T1/T2 mevzuatta Turkiye'de sarap ithalatcisi olmayi YASAKLAYAN hukum
    yoktur. Gerekli belgeler tanimli, 2026 bedelleri resmi tebliglerle bilinir ve
    buyuklukleri karsilanabilir duzeydedir (~151-253 bin TL sabit). Depo sarti
    sozlesmeli dagitim agi ile karsilanabilir.
  kosullu_mu: true
  blocked_a_cevirecek_bulgular:
    - "T-201: 4250 s.K. m.1/3 1.000.000 litre/yil esiginin durgun sarap ithalatina bugun de uygulandiginin teyidi"
    - "T-202: Dagitim yetki belgesi inceleme suresinin fiilen 6 ayi asmasi"
  notes: >
    Bu bir ONERIDIR. Nihai karar yatirim-komitesi-baskani'na aittir.
    mevzuat-ruhsat-uzmani kendi basina KILL karari VERMEZ.

