    status: "BASE=ESTIMATE (yasal tavan) · C-601 ACIK"
    ticket: T-614
    modelde_eksik:
      finansman_maliyeti_satiri: null
      status: "SIFIR ALINDI — HICBIR SATIR YOK"
      yon: "MAX_CIF'i YUKARI saptirir (projenin LEHINE)"
      cift_sayim_uyarisi: >
        Finansman maliyeti YA ayri bir L5 satiri olur YA DA d icinde erken
        odeme iskontosu olarak gorunur. IKISI BIRDEN olursa CIFT SAYIMDIR (K6b).

  return_iade:
    payer: "ITHALATCI (biz)"
    receiver: "perakendeci (iade/alacak faturasi ile)"
    layer: "L6 faturasinin TERSINE CEVRILMESI"
