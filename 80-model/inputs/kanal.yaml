      ODENECEK BEDELLER' basligi altindadir -> referans buyukluk ithalatcinin
      faturasidir. (3) d'nin L8 uzerinden hesaplandigi bir dunyada perakendeci
      KENDI FIYATLAMA KARARIYLA bizim primimizi yukseltebilirdi — bu 6585
      m.6/2(c) 'tek tarafli degisiklik yetkisi' yasagiyla celisirdi
      (EV-2026-08-10-601).
    currency: TRY
    fixed_or_variable: "KARISIK — SEPETIN TAMAMI ORANSAL DEGILDIR"
    per_bottle_or_total: "oransal bilesenler PER_BOTTLE; sabit bilesenler TOTAL"
    tax_treatment: "hizmet faturasi -> KDV'ye tabi; indirilebilirlik BLOCKED (T-611)"
    evidence_id: [EV-2026-08-10-612, EV-2026-08-10-610]
    status: "varlik FACT · oran UNKNOWN · SEPETIN YAPISI BLOCKED"
    ticket: T-613
    sepet_ayristirmasi:
      status: BLOCKED
      istenen_formul: "L7_eff = L6*(1 - d_var) - f_per_bottle - D_fix/Q_ithal"
      kalemler:
        ciro_primi_yilsonu_iskontosu:  {muhtemel_matrah: L6, tip: VARIABLE, status: "matrah TUTARLI"}
        lojistik_bedeli:               {muhtemel_matrah: "L6 VEYA palet/sevkiyat basi", tip: BLOCKED, ticket: T-613}
        alan_kullanimi_teshir:         {muhtemel_matrah: "magaza x donem (TL)", tip: FIXED,  status: BLOCKED}
        kirik_urun_bedeli:             {muhtemel_matrah: "KIRILAN ADET (ciro DEGIL)", tip: "VARIABLE ama BASKA HACME", status: BLOCKED}
        sogutucu_enerji_bedeli:        {muhtemel_matrah: "sogutucu x donem (TL)", tip: FIXED, status: BLOCKED}
        crm_b2b_kasa_cikisi_cirosu:    {muhtemel_matrah: "L8 (kasa cikisi!) OLABILIR", tip: BLOCKED, status: BLOCKED}
      notes: >
        ALTI KALEMIN EN AZ UCU SABIT TUTARLIDIR ve model altisini da ORANSAL
        sayiyor. Sonuc: f'deki olcek asimetrisi d'nin ICINE GIZLENIYOR.
        CRM/B2B'nin adi bile matrahinin 'kasa cikisi' yani L8 olabilecegini
        soyluyor; oyleyse L6 matrahiyla yazmak SISTEMATIK EKSIK SAYIMDIR
