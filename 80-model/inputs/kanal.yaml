# KANAL GİRDİLERİ
# Sahibi: kanal-marj-uzmani
#
# KURAL: evidence_id'si olmayan sayı modele GİREMEZ.
# KURAL: Her marj icin DORT sey belirtilmeden deger gecersizdir:
#        (1) hangi iki katman arasi  (2) brut mu net mi
#        (3) KDV dahil mi haric mi   (4) margin mi markup mi
# KURAL: Kanal kosullari genellikle T4/T5'tir — min/base/max ZORUNLU.
#
# TUR 2 NOTU (kanal-marj-uzmani, 2026-08-10):
#   Bu dosya TUR 2'de ILK KEZ doldurulmustur. Doldurulan alanlarin cogu
#   ticari kosulun VARLIGINI kanitlar, TUTARINI DEGIL. Tutarlar Turkiye'de
#   sistematik olarak TICARI SIRDIR (bkz. EV-2026-08-10-610, -611, -612:
#   Rekabet Kurumu'nun kendi raporlarinda bile oranlar KARARTILMISTIR).
#   Bu nedenle bircok alan bilerek null + UNKNOWN birakilmistir.
#   Duyarlilik bantlari AYRI bir blokta (duyarlilik_senaryolari) tutulur ve
#   modele TEK SAYI olarak GIREMEZ.
#
#   Ana dokumanlar:
#     70-kanal/kanal-marj-yapisi.md      (uc kanal x tum kalemler)
#     70-kanal/marj-vs-markup.md         (tanim sozlesmesi + ornek hesap)
#     70-kanal/kendi-dagitim-senaryosu.md (own distribution veri yapisi)
#     70-kanal/rapor-tur2-kanal-marj.md  (rapor)
#
# TUR 3A NOTU (kanal-marj-uzmani, 2026-08-10) — KATMAN/MATRAH DENETIMI:
#   Bu turda HICBIR YENI DEGER EKLENMEMISTIR. Eklenen tek sey METADATA'dir:
#   her kalemin HANGI KATMANDA ve HANGI MATRAH uzerinden calistigi.
#   Gerekce: TUR 2.5'te R5 hatasi (-28,95 TL/sise) bir ARITMETIK hatasi degil,
#   bir MATRAH hatasiydi (L6 ile L7_eff'in birbirinin yerine kullanilmasi) ve
#   R8 round-trip'ten 2.700/2.700 satirda TEMIZ GECTI (T-942).
#
#   YENI DOKUMANLAR:
#     70-kanal/kanal-katman-matrah-haritasi.md   (kalem x 10 zorunlu alan, uc kanal)
#     70-kanal/kanal-bacagi-hata-listesi.md      (K1..K12 + TVK-1..TVK-P6)
#     70-kanal/rapor-tur3a-kanal-marj.md         (rapor)
#
#   YENI STATU ETIKETI — `BLOCKED`:
#     UNKNOWN = bir SEVIYENIN bilinmemesi        -> duyarlilikla yonetilebilir
#     BLOCKED = bir DENKLEMIN SEKLININ bilinmemesi -> yonetilemez, cunku hangi
#               eksene konulacagi bile bilinmez. BLOCKED kalem modele SESSIZCE
#               0 olarak GIREMEZ; 0 alindiysa CIKTIDA YAZILMAK ZORUNDADIR.

meta:
  dosya: kanal.yaml
  son_guncelleme: 2026-08-10
  tur: "TUR 3A — kanal katman/matrah denetimi (TUR 2 dolumunun uzerine METADATA)"
  durum: KISMI_DOLU
  rapor: 70-kanal/rapor-tur3a-kanal-marj.md
  onceki_rapor: 70-kanal/rapor-tur2-kanal-marj.md
  acik_ticketlar: [T-601, T-602, T-603, T-604, T-605,
                   T-611, T-612, T-613, T-614, T-615, T-616, T-617, T-618, T-619]
  acik_celiskiler: [C-601, C-602, C-611]
  cevaplanan_ticketlar_tur3a: [T-943, T-944, T-856]
  evidence_araligi: "EV-2026-08-10-601 .. EV-2026-08-10-624"
  tur3a_yeni_evidence: "YOK — yeni arastirma yapilmamistir (sinirli denetim turu)"
  tur3a_yeni_marj_degeri: "YOK — bu tur SAYI uretmez, MATRAH tanimlar"

# =====================================================================
# BAGLAYICI KULLANIM KURALLARI  (M1-M6)
# BU DOSYADAN OKUMADAN SAYI ALINAMAZ.
# =====================================================================
kullanim_kurallari:
  M1: >
    Bu dosyadaki hicbir marj rakami dort niteligi (katman cifti, brut/net,
    KDV dahil/haric, margin/markup) belirtilmeden alintılanamaz. Dordu eksikse
    sayi GECERSIZDIR ve finans-fizibilite tarafindan REDDEDILMELIDIR.
  M2: >
    pazar.yaml katman_kurallari.K2 geregi L7 (retailer purchase price) Metro raf
    fiyatindan TURETILMEMISTIR. Bu dosyada L7 bagimsiz bir DENKLEMLE kurulmustur:
    L7_effective = L6 * (1 - d) - f_per_bottle. L7'nin SAYISAL degeri UNKNOWN'dir.
  M3: >
    pazar.yaml K5 geregi 599,90 / 649,90 TL bir METRO CASH & CARRY gozlemidir.
    Bu dosyada hedef fiyat olarak KULLANILMAMISTIR. Ters model calistirilirken
    hedef L8 en az iki alternatifle (band) birlikte verilmelidir.
  M4: >
    IP-2001 / T-205 geregi alkolde reklam-tanitim-gorsel kaldiraclari YOKTUR.
    Bu bir belirsizlik degil, bu dosyanin BASLANGIC KOSULUDUR. Marka insa
    harcamasi ATL kalemi olarak MODELLENEMEZ; varsa kanal maliyeti olarak gorunur.
  M5: >
    FMCG geneli / sut kategorisi / tum-kategori perakende verisinden saraba
    yapilan her gecis ESTIMATE'tir. Bu dosyada hicbir yerde sarap verisi gibi
    sunulmamistir. Kaynak kategorisi her alanda yazilidir.
  M6: >
    Vergi orani (KDV/OTV), navlun, ruhsat bedeli ve tedarikci fiyati bu dosyanin
    KAPSAMI DISINDADIR. Formullerde t_kdv sembolik birakilmistir; degeri
    vergi.yaml'dan alinir.
  M7: >
    TUR 3A. Her ticari kosul kalemi ON ALANLA tanimlanir: payer, receiver,
    layer, basis, currency, fixed_or_variable, per_bottle_or_total,
    tax_treatment, evidence_id, status. Alanlardan biri eksikse kalem
    BLOCKED'dir ve modele SESSIZCE 0 OLARAK GIREMEZ. Tam tanim:
    70-kanal/kanal-katman-matrah-haritasi.md §2.
  M8: >
    TUR 3A. L7 CIPLAK TOKENI YASAKTIR — her kullanimda L7_eff yazilir.
    L6 (fatura fiyati) ile L7_eff (ithalatcinin FIILI net hasilati) IKI AYRI
    SAYIDIR ve aralarindaki fark (d*L6 + f) TAM OLARAK R5 hatasinin
    buyuklugudur. Ayrica L6_gross = L6*(1+v) bu turda repoya YENI GIRMISTIR
    ve ALACAK TUTARIDIR (vade ve peak_cash BUNUN uzerinden kurulur, L6 degil).

# =====================================================================
# FIYAT MERDIVENI DENKLEMI — MODELIN TASIYICI FORMULU
# =====================================================================
merdiven_denklemi:
  ileri: |
    L7_effective = L6 * (1 - d) - f_per_bottle
    L8_kdv_haric = L7_effective / (1 - m_retail)
    L8_kdv_dahil = L8_kdv_haric * (1 + t_kdv)
  ters: |
    L8_kdv_haric = L8_kdv_dahil / (1 + t_kdv)
    L7_effective = L8_kdv_haric * (1 - m_retail)
    L6           = (L7_effective + f_per_bottle) / (1 - d)
  degiskenler:
    L6: "ithalatci FATURA fiyati, KDV haric"
    d: "ciroya oranli geri akan bedeller toplami (ciro primi, alan kullanimi, lojistik bedeli, kirik urun bedeli, enerji, CRM/B2B)"
    f_per_bottle: "sabit bedellerin sise basina payi = listeleme_bedeli / yillik_sise"
    m_retail: "gross margin ON SELLING PRICE, KDV haric, L7 -> L8"
    t_kdv: "vergi.yaml alani — bu ajanin degil"
  cozulebilirlik:
    value: false
    status: FACT
    notes: >
      Denklem bu turda SAYISAL OLARAK COZULEMEZ. Dort bilinmeyen vardir:
      L8_CHAIN_RETAIL (pazar.yaml, UNKNOWN, T-603), m_retail (sarap icin UNKNOWN),
      d (UNKNOWN), f_per_bottle (UNKNOWN). Model bunlari senaryo olarak
      calistirmalidir; tek sayiya kilitlenmemelidir.

  # -------------------------------------------------------------------
  # TUR 3A DUZELTMESI — merdiven_denklemi.ileri/ters YETERSIZDIR.
  # Tam kapali formul seti: 70-kanal/kanal-katman-matrah-haritasi.md §9
  # -------------------------------------------------------------------
  tur3a_duzeltilmis_ileri: |
    K1  L8_net       = L8_gross / (1 + v)          [KDV: ZINCIRDEKI TEK BOLME]
    K2  L7_eff       = L8_net * (1 - m)            [CHAIN/TEKEL: margin on selling price]
        L7_eff       = L8_net / k                  [HORECA: carpan, matrah L7_eff]
    K3  f_per_bottle = F_total / Q_ithal           [<-- TUREVDIR, GIRDI DEGILDIR]
    K4  L6           = (L7_eff + f_per_bottle + D_fix/Q_ithal) / (1 - d_var)
    K5  L5_max       = L7_eff - mu_kesintisi - m_dist_kesintisi - iade_kaybi
    K6  L6_gross     = L6 * (1 + v)                [ALACAK TUTARI — vade/peak_cash]
  tur3a_r8k_assertion: |
    # T-942'nin onerdigi hali DEGIL — bkz. T-619
    K1' L7_eff_geri = L5_max + mu_kesintisi + m_dist_kesintisi + iade_kaybi
    K2' L8_net_geri = L7_eff_geri / (1 - m)        [HORECA: * k]
    K3' L8_geri     = L8_net_geri * (1 + v)
    assert | L8_geri - L8_gross | < 0,01 TL
    # L6 BU ZINCIRDE HIC KULLANILMAZ.
  tur3a_r8k_uyarisi:
    status: CRITICAL
    ticket: T-619
    notes: >
      T-942'nin onerdigi 'adim K1: L6_geri = (L5_max + mu*L6)' satirinda ETIKET
      YANLISTIR. L5_max + mu*L6 ifadesi L6'ya DEGIL L7_eff'e esittir; L6
      etiketiyle devam edilince K2'de *(1-d)-f IKINCI KEZ uygulanir ve assertion
      TERSINE DONER: DOGRU formul 735,08 TL uretip REDDEDILIR, NAIF formul
      799,00 TL uretip KABUL EDILIR. Yani birebir kodlanirsa R5 duzeltmesini
      GERI ALIR. T-942'nin TESHISI DOGRUDUR; hatali olan yalnizca K1 etiketidir.

# =====================================================================
# TUR 3A — KALEM x KATMAN x MATRAH HARITASI (METADATA; DEGER ICERMEZ)
# Tam belge: 70-kanal/kanal-katman-matrah-haritasi.md
# Her kalem ON alanla tanimlidir (M7). Degerler ilgili kanal bloklarindadir.
# =====================================================================
kalem_katman_matrah_haritasi:
  belge: 70-kanal/kanal-katman-matrah-haritasi.md
  hata_listesi: 70-kanal/kanal-bacagi-hata-listesi.md

  margin_basis:
    payer: "tuketici (raf fiyatina gomulu; NAKIT CIKISI degil, FIYAT FARKI)"
    receiver: "perakendeci / HoReCa noktasi"
    layer: "L7 -> L8 (katman KOPRUSU)"
    basis: L8_net                     # MARGIN ON SELLING PRICE
    currency: TRY
    fixed_or_variable: VARIABLE
    per_bottle_or_total: PER_BOTTLE
    tax_treatment: "Kendisi KDV'ye tabi bir kalem DEGILDIR (fatura edilmez). Iki bacak da KDV HARIC olmak ZORUNDA."
    evidence_id: EV-2026-08-10-616
    status: ASSUMPTION
    engine_dogrulama: "ters_model.py:277 l7 = l8_net*(1-m) -> DOGRU (K2 hatasi YAPILMAMIS)"

  markup_basis:
    payer: "margin_basis ile ayni"
    receiver: "margin_basis ile ayni"
    layer: "L7 -> L8"
    basis: L7_eff                     # MARKUP ON PURCHASE PRICE
    currency: TRY
    fixed_or_variable: VARIABLE
    per_bottle_or_total: PER_BOTTLE
    tax_treatment: "margin_basis ile ayni"
    evidence_id: "EV-2026-08-10-616 (turetme: k = m/(1-m))"
    status: DERIVED
    modele_girme_kurali: ENGINE_OKUMAZ
    notes: >
      m ve k AYNI gercegin iki ifadesidir; IKISI BIRDEN dusulurse CIFT SAYIMDIR.
      markup_karsiligi_pct alanlari YALNIZCA MUZAKERE TERCUMESI icindir.
      MUZAKERE UYARISI: perakendeci "marjim %X" derken m'yi (L8_net matrahi),
      tedarikci/distributor "ustune %X koyuyorum" derken k'yi (L7_eff matrahi)
      kasteder. Matrah yazilmadan gorusme notuna sayi KAYDEDILEMEZ.

  kdv_v1_raf_menu:
    payer: tuketici
    receiver: "Hazine (perakendeci uzerinden)"
    layer: L8
    basis: L8_net
    currency: TRY
    fixed_or_variable: VARIABLE
    per_bottle_or_total: PER_BOTTLE
    tax_treatment: "zincirdeki TEK KDV bolmesi (R1)"
    evidence_id: EV-2026-08-09-118
    status: FACT
    horeca_uyarisi:
      status: BLOCKED
      ticket: T-612
      notes: >
        HoReCa'da L8 bir MENU FIYATIDIR ve menu KDV'si YIYECEK-ICECEK HIZMETI
        KDV'sidir. Urun KDV oraniyla AYNI OLUP OLMADIGI DOGRULANMAMISTIR.
        marj-vs-markup.md §2.3 bu riski TUR 2'de YAZMIS, model KULLANMAMISTIR.
        reverse-price-model.md §3.2'nin 15 HoReCa hucresinin 15'i bu
        dogrulanmamis orandan geciyor -> HoReCa sutunu BLOCKED.

  kdv_v2_mal_faturasi:
    payer: "perakendeci (bize oder)"
    receiver: "Hazine (biz beyan eder ve odiyoruz)"
    layer: "L6 uzerine EKLENIR -> L6_gross"
    basis: L6
    currency: TRY
    fixed_or_variable: VARIABLE
    per_bottle_or_total: PER_BOTTLE
    tax_treatment: >
      Ekonomik maliyet DEGILDIR (tahsil edilip beyan edilir). AMA NAKITTE IKI
      AYRI ZAMAN VARDIR: tahsilat = fatura + kanal vadesi; beyan = fatura
      tarihini izleyen donem. ARADAKI FARK BIZIM FINANSMAN MALIYETIMIZDIR.
    evidence_id: EV-2026-08-09-118
    status: STRUCTURAL_FACT
    ticket: T-614
    notes: >
      ALACAK TUTARI L6 DEGIL L6_gross = L6*(1+v)'DIR. peak_cash alacak bacagi
      L6 uzerinden kurulursa %20 EKSIK cikar.

  kdv_v3_hizmet_faturasi:
    payer: "ITHALATCI (biz)"
    receiver: "Hazine (perakendeci uzerinden)"
    layer: "L6 -> L7 koprusu"
    basis: "(d * L6) + f"
    currency: TRY
    fixed_or_variable: VARIABLE
    per_bottle_or_total: PER_BOTTLE
    tax_treatment: "BLOCKED — indirilebilir mi? ciro primi iskonto mu hizmet mi? VERGI SORUSU"
    evidence_id: EV-2026-08-10-610
    status: BLOCKED
    ticket: T-611
    notes: >
      Model bugun SESSIZCE 'indirilebilir' varsayiyor (f ve d'yi NET tutariyla
      dusuyor) ama bunu YAZMIYOR. Indirilemiyorsa ekonomik maliyet 1,20 KATIDIR.
      HER HALUKARDA BIR NAKIT CIKISIDIR ve peak_cash'e girer.

  listing_fee_f:
    payer: "ITHALATCI (biz)"
    receiver: "zincir perakendeci"
    layer: "L6 -> L7 koprusu. L6'yi DEGISTIRMEZ, L7_eff'i DUSURUR. L8'de GORUNMEZ."
    basis: "BIR ORAN DEGILDIR — BIR TUTARDIR: (SKU) x (zincir VEYA magaza) x (donem)"
    currency: TRY
    fixed_or_variable: FIXED
    per_bottle_or_total: TOTAL
    tax_treatment: "hizmet faturasi -> KDV'ye tabi (EV-2026-08-10-610); indirilebilirlik BLOCKED (T-611)"
    evidence_id: "yasal cerceve: EV-2026-08-10-601/-605/-608 ; TUTAR: EV-2026-08-10-619 (2004, T5) MODELE GIREMEZ"
    status: "UNKNOWN (tutar) + BLOCKED (birim: SKU x zincir mi SKU x magaza mi)"
    engine_kurali:
      f_per_bottle_girdi_olarak_kabul_edilemez: true
      formul: "f_per_bottle = F_total / Q_ithal"
      assertion: "f_per_bottle(Q1)*Q1 == f_per_bottle(Q2)*Q2"
      ticket: T-613
      notes: >
        f HACME BAGLI bir sayidir ve HIPERBOLIKTIR, dogrusal degil. f'yi sise
        basi sabit tasimak (K7) hacim riskini modelden TAMAMEN SILER ve
        ozellikle PILOT (5.000 sise) hucresinde projenin LEHINE calisir.

  turnover_rebate_d:
    payer: "ITHALATCI (biz)"
    receiver: "zincir perakendeci"
    layer: "L6 -> L7 koprusu"
    basis: L6                          # KDV HARIC FATURA CIROSU
    basis_gerekcesi: >
      (1) Ciro primi TEDARIKCININ kestigi faturalar uzerinden hesaplanir
