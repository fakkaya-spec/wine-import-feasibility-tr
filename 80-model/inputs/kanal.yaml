    evidence_id: [EV-2026-08-10-606, EV-2026-08-10-612]
    status: "yapisal FACT · ORAN UNKNOWN · geri_kazanilabilir_deger BLOCKED"
    ticket: T-615
    notes: >
      IADENIN BEDELI L5 DEGIL L6'DIR: fatura fiyati geri doner, malin degeri
      en iyi halde L5, en kotu halde SIFIRDIR (kirik / SKT / bandrol hasari).
      IKINCI VE DAHA BUYUK HATA (K11): sabit maliyetler ITHAL EDILEN adede
      bolunuyor ama hasilat ureten adet Q*(1-r)'dir. r=%5'te MAX_CIF etkisi
      -19,38 TL/sise — R5 hatasiyla (28,95) AYNI SINIFTA ve bugun r=0.

  logistics_deduction:
