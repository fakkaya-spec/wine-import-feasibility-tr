# ---------------------------------------------------------------------------
# ARASTIRMA BULGULARI — TEKLIF DEGILDIR, PIYASA GOZLEMIDIR
# Modelde YALNIZCA duyarlilik araligi sinirlari olarak kullanilabilir.
# Tek bir fiyat girdisi olarak KULLANILAMAZ.
# ---------------------------------------------------------------------------
arastirma_bulgulari:

  private_label_moq:
    dogrulanmis_en_dusuk:
      value: 3000
      unit: sise
      status: FACT
      tier: T4
      evidence_id: "EV-2026-08-09-408"
      notes: "Interbrosa (ES), 4 palet / sarap. SKU bazli MOQ."
    dogrulanmis_ikinci:
      value: 3600
      unit: sise
      status: FACT
      tier: T4
      evidence_id: "EV-2026-08-09-410"
      notes: "The Wine Factory (FR). SKU bazli MOQ."
    konteyner_bazli_ornek:
      value: "1 x 20ft mixed (2 SKU)"
      unit: konteyner
      status: FACT
      tier: T4
      evidence_id: "EV-2026-08-09-409"
      notes: "Vina Maria (ES). Konteynerin kac sise aldigi UNKNOWN — navlun-lojistik-uzmani (T-402)."
    celiskili_iddia:
      value: "300-1200"
      unit: sise
      status: CONFLICT
      tier: T5
      evidence_id: "EV-2026-08-09-424"
      conflict_id: "C-401"
      notes: "Agregator icerigi. Dogrulanmis uretici beyanlariyla celisiyor. Modelde KULLANILAMAZ."
    pilot_uyumu:
      value: true
      status: ESTIMATE
      evidence_id: "EV-2026-08-09-408, EV-2026-08-09-410"
      notes: >-
        Charter pilot hacmi 5000 sise. Dogrulanmis en dusuk MOQ 3000-3600 sise.
        Yani private label pilot olcekte TEKNIK OLARAK uygulanabilir gorunuyor.
        Bu bir FIYAT veya KARLILIK ifadesi DEGILDIR.

  uretim_lead_time_gun:
    aralik:
      value: "28-42"
      unit: gun
      status: ESTIMATE
      tier: T4
      evidence_id: "EV-2026-08-09-410, EV-2026-08-09-411"
      notes: >-
        Yalnizca URETIM/SISELEME suresi. NAVLUN, gumruk ve ic lojistik HARICTIR.
        Iki uretici beyanindan turetilmistir (FR 4-6 hafta, ZA ~4 hafta) — n=2.

  # -------------------------------------------------------------------------
  # T-902 DUZELTMESI (TUR 1.5, 2026-08-10)
  # Eski ad: `fob_gosterge_bandi` — blok seviyesinde `katman: L1` tasiyordu.
  # O etiket YANLISTI ve GERI CEKILDI. Blok bir "FOB bandi" DEGILDIR:
  # alt siniri ile ust siniri AYNI MALIYET MERDIVENININ AYNI BASAMAGI DEGILDIR.
  # Deger olarak hicbir sey degismedi; degisen etikettir.
  # -------------------------------------------------------------------------
  duyarlilik_sinirlari_KARISIK_KATMAN:
    eski_adi: "fob_gosterge_bandi (TUR 1) — 'FOB' cagrisimi YANLISTI, T-902 ile degistirildi"
    evidence_id: "EV-2026-08-10-402"
    supersedes_evidence: "EV-2026-08-09-421"
    katman: null
    katman_status: UNKNOWN
    katman_aciklamasi: >-
      BU BLOGUN TEK BIR KATMANI YOKTUR. Alt sinir ile ust sinir FARKLI KATMANLARDAN
      gelir; ikisi arasindaki mesafe bir katman araligi degil, IKI AYRI OLCUMUN
      arasindaki mesafedir. Blok seviyesinde katman etiketi verilemez -> null/UNKNOWN.
    neden_bant_degil: >-
      (1) Alt sinir EUR, ust sinir USD'dir ve BILINCLI OLARAK birlestirilmemistir —
          aritmetik olarak bir "bant" olusturmazlar.
      (2) Alt sinir L0'in bile ALTINDADIR (yalnizca sivi girdi maliyeti).
      (3) Ust sinir L2'dir (CIF).
      Yani bu bir "FOB araligi" degil, iki YONLU BIR CITTIR: gercek L0/L1 fiyatinin
      hangi iki gozlemin arasinda kalmasi GEREKTIGINI soyler, NEREDE oldugunu SOYLEMEZ.
    alt_sinir_sivi_maliyeti:
      value: 0.56
      unit: EUR
      per: "750 ml"
      status: ESTIMATE
      tier: T3
      evidence_id: "EV-2026-08-09-402"
      katman: "L0_ALTI"
      katman_uyarisi: >-
        BU SAYI L0 (EXW) DEGILDIR, L0'IN ALTINDADIR. Yalnizca sivinin dunya ortalama
        dokme ihracat fiyatidir; kuru malzeme (sise, kapak, kapsul, etiket, koli),
        siseleme isciligi ve uretici marji HARICTIR ve UNKNOWN'dir.
      notes: >-
        Dunya dokme sarap ort. ihracat fiyati 0.75 EUR/l x 0.75 l.
        Gercek EXW her zaman bunun UZERINDEDIR. Bu bir TABAN, tahmin degildir.
        Kuru malzeme kalemleri RFQ 3.18 ile sorulacak (rfq-template.md v2.1).
    ust_sinir_cif_tavani:
      value: "1.85 - 2.40"
      unit: USD
      per: "750 ml"
      status: ESTIMATE
      tier: T3
      evidence_id: "EV-2026-08-09-405"
      katman: "L2"
      katman_uyarisi: "BU BIR L2 (CIF) SAYISIDIR. FOB tanim geregi bunun ALTINDADIR."
      notes: >-
        Turkiye'ye 2025'te fiilen giren en ucuz menseilerin CIF birim degerleri
        (Moldova 1.85 / Gurcistan 1.93 / Ispanya 2.03 / Sili 2.17 / Portekiz 2.40).
        CIF'ten navlun DUSULMEMISTIR — navlun tutari navlun-lojistik-uzmani alanidir.
    ara_dogrulama:
      value: 1.98
      unit: USD
      per: "sise — sise hacmi kaynakta BELIRTILMEMIS, 750 ml VARSAYILMISTIR"
      status: ESTIMATE
      status_tur1: "FACT — T-902 ile ESTIMATE'e cevrildi"
      tier: T4
      evidence_id: "EV-2026-08-10-403"
      supersedes_evidence: "EV-2026-08-09-419"
      katman: null
      katman_status: UNKNOWN
      katman_uyarisi: >-
        BU SAYIYA L1 (FOB) DENEMEZ. Ulusal ihracat istatistiklerinin FOB bazinda
        raporlandigi YAYGIN bir uygulamadir ama ONVV icin DOGRULANMAMISTIR
        (bkz. EV-2026-08-09-404 hata kaynagi #3: "ulkeler arasi raporlama pratigi
        tam ayni degildir"). Katman iddiasi GERI CEKILDI.
      neden_estimate: >-
        Kaynak "sise basina 1.98 USD" diyor ama sise HACMINI yazmiyor. "1.98 USD /
        750 ml" ifadesi bir VARSAYIM icerir, dolayisiyla FACT degil ESTIMATE'tir
        (CLAUDE.md §3). Kaynagin ilan ettigi "sise basina ort. ihracat fiyati = 1.98 USD"
        kismi FACT olarak EV-2026-08-09-419'da durmaya devam eder.
      notes: "Moldova siselenmis sakin sarap ort. ihracat fiyati, 8A2025, ONVV."
    kullanim_kurali:
      value: "SENSITIVITY_BOUNDS_ONLY"
      status: FACT
      cit_korundu: true
      notes: >-
        CIT KORUNDU VE GEREKCESI GENISLETILDI (T-902).
        Bu sinirlar modelde TEK BASINA FIYAT GIRDISI OLARAK KULLANILAMAZ ve
        BIRBIRINDEN CIKARILAMAZ. Yalnizca duyarlilik analizinin alt/ust sinirlarini
        belirlemek icin kullanilabilir; duyarlilik ciktisi raporlanirken HANGI SINIRIN
        HANGI KATMANDAN geldigi yazilmak ZORUNDADIR.
        EUR ve USD BILINCLI OLARAK BIRLESTIRILMEMISTIR; kur donusumu yalnizca
        makro.yaml'daki kanitli kurla, modelde yapilir.
        Cit neden korundu: T-902 bulgunun kendisini degil ETIKETINI reddetti. Sinirlarin
        altindaki kanitlar (EV-402, EV-405, EV-419) gecerlidir; degisen, bu sinirlarin
        bir FOB araligi OLMADIGININ acikca yazilmasidir. Cit kaldirilirsa yanlis etiket
        modele sizabilir hale gelir.
    finans_fizibiliteye_uyari: >-
      Bu blok L1 (FOB) girdisi DEGILDIR ve L2'den CIKARILARAK navlun turetilemez.
      Boyle bir islem NEGATIF NAVLUN uretir. `fiyat.fob_per_sise` null/UNKNOWN'dir
      ve oyle kalmalidir; gercek FOB yalnizca RFQ ile alinacak FIRM_OFFER'dan gelir.

  ulke_gosterge_birim_degerleri:

    # -----------------------------------------------------------------------
    # T-902 DUZELTMESI (TUR 1.5, 2026-08-10)
    # Eski ad: `katman_L1_ihracat_ort_EUR_per_litre`.
    # L1 (FOB) IDDIASI GERI CEKILDI. Degerler DEGISMEDI.
    # -----------------------------------------------------------------------
    ihracat_ort_birim_degeri_EUR_per_litre:
      eski_adi: "katman_L1_ihracat_ort_EUR_per_litre (TUR 1) — 'L1' iddiasi geri cekildi"
      status: ESTIMATE
      tier: T3
      evidence_id: "EV-2026-08-10-401"
      supersedes_evidence: "EV-2026-08-09-404"
      katman: null
      katman_status: UNKNOWN
      katman_iddiasi_geri_cekildi: true
      katman_uyarisi: >-
        BU SERIYE L1 (FOB) DENEMEZ ve L2 CIF SERISINDEN CIKARILAMAZ.
        Iddia iki nedenle geri cekildi: (1) OIV ihracat birim degerlerinin FOB bazinda
        oldugu DOGRULANMADI (EV-2026-08-09-404 hata kaynagi #3); (2) asagidaki
        `karsilastirilamazlik_kaniti`.
      uyari: "ULKE ORTALAMASI — fiyat/performans segmenti bunun ALTINDADIR."
      kapsam: >-
        Her ulkenin TUM DUNYAYA yaptigi siselenmis sarap ihracatinin ortalama birim
        degeri (premium SKU'lar dahil). Turkiye'ye giden karma DEGILDIR.
      degerler:
        sili: 2.68
        guney_afrika: 2.72
        ispanya: 2.87
        portekiz: 3.43
        arjantin: 3.75
        italya: 4.39
        avustralya: 4.99
        fransa: 7.79
        abd: 7.89

    # -----------------------------------------------------------------------
    # IKI SERININ NEDEN KARSILASTIRILAMAZ OLDUGU (T-902 istegi #3)
    # Bu blok bir DEGER TASIMAZ; bir KULLANIM YASAGI tasir.
    # -----------------------------------------------------------------------
    karsilastirilamazlik_kaniti:
      status: FACT
      evidence_id: "EV-2026-08-10-401, EV-2026-08-09-405"
      iki_seri:
        A: "ihracat_ort_birim_degeri_EUR_per_litre (OIV turetmesi, EUR/litre)"
        B: "katman_L2_turkiye_cif_USD_per_litre_2025 (UN Comtrade, USD/litre, L2 CIF)"
      gozlem: >-
        A serisi UC MENSEDE B serisinden BUYUKTUR. Eger A gercekten L1 (FOB) olsaydi
        A < B olmasi ZORUNLU olurdu (aradaki fark navlun + sigortadir). Terslik,
        A'nin L1 OLMADIGININ degil de olsa olsa iki serinin AYNI MERDIVENIN BASAMAKLARI
        OLMADIGININ dogrudan kanitidir.
      terslik_tablosu:
