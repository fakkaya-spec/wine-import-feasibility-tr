# TEDARİKÇİ GİRDİLERİ
# Sahibi: global-sourcing-kasifi
#
# KURAL: evidence_id'si olmayan sayı modele GİREMEZ.
# KURAL: EXW fiyati L0, FOB fiyati L1 katmanidir. KARISTIRILMAZ.
#
# TUR 1 SONU DURUMU:
#   Bu turda HICBIR URETICIDEN TEKLIF ALINMAMISTIR.
#   Bu nedenle `secili_tedarikci` ve `fiyat` bloklarinin TAMAMI null/UNKNOWN'dir.
#   Asagidaki `arastirma_bulgulari` blogu, kanit kimligi olan PIYASA GOZLEMLERIDIR;
#   bunlar TEKLIF DEGILDIR ve tek basina fiyat girdisi olarak kullanilamaz.

meta:
  dosya: tedarikci.yaml
  son_guncelleme: 2026-08-10
  tur: "TUR 2 — COMMERCIAL VALIDATION (TUR 1.5 katman duzeltmeleri KORUNDU)"
  durum: KISMI_DOLU_TEKLIF_YOK
  teklif_alindi_mi: false
  havuz_dosyasi: "50-sourcing/supplier-shortlist-v2.csv (TUR 2); 50-sourcing/tedarikci-havuzu.csv (TUR 1, korunur)"
  dogrulanmis_tedarikci_sayisi: 26
  rfq_sablonu: "50-sourcing/rfq-template.md (v2.1, READY_TO_SEND, GONDERILMEDI)"
  tur2_degisiklik_ozeti: >-
    TUR 1.5'te T-902 ile duzeltilen KATMAN ETIKETLERINE DOKUNULMADI.
    `duyarlilik_sinirlari_KARISIK_KATMAN` blogu, `ihracat_ort_birim_degeri_EUR_per_litre`
    blogu ve `SENSITIVITY_BOUNDS_ONLY` citi AYNEN DURUYOR.
    TUR 2'de YALNIZCA EKLEME yapildi:
    (1) `arastirma_bulgulari.tur2_bulgulari` blogu eklendi;
    (2) `dogrulanmis_tedarikci_sayisi` 11 -> 26 (aday sayisidir, ALTERNATIF sayisi DEGIL);
    (3) `fiyat` blogundaki alanlarin HICBIRI degismedi — exw/fob HALA null/UNKNOWN.
    TUR 2'de bulunan TEK yayinlanmis fiyat (EV-2026-08-10-451) para birimi ve
    katmani belirsiz oldugu icin `fiyat` blogunu DOLDURAMAZ (T-466).
  tur15_degisiklik_ozeti: >-
    T-902 uyarinca IKI ALANIN KATMAN ETIKETI GERI CEKILDI. HICBIR DEGER DEGISMEDI;
    hicbir yeni sayi eklenmedi. Degisen yalnizca etiketlerdir:
    (1) `fob_gosterge_bandi` blogu `duyarlilik_sinirlari_KARISIK_KATMAN` olarak
        yeniden adlandirildi; blok seviyesindeki `katman: L1` KALDIRILDI, her sinira
        KENDI katmani yazildi (alt sinir: L0_ALTI, ust sinir: L2, ara dogrulama: UNPROVEN).
    (2) `katman_L1_ihracat_ort_EUR_per_litre` ->
        `ihracat_ort_birim_degeri_EUR_per_litre` olarak yeniden adlandirildi;
        L1 iddiasi GERI CEKILDI, `katman: null / katman_status: UNKNOWN` yapildi.
    (3) `ara_dogrulama.status`: FACT -> ESTIMATE (sise hacmi 750 ml VARSAYIMI nedeniyle).
    (4) `SENSITIVITY_BOUNDS_ONLY` citi KORUNDU ve gerekcesi genisletildi.

