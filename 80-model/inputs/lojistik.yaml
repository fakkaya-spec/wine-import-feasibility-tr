# LOJİSTİK GİRDİLERİ
# Sahibi: navlun-lojistik-uzmani
#
# KURAL: evidence_id'si olmayan sayı modele GİREMEZ.
# KURAL: Navlun CIF'e giriyorsa AYRICA lojistik gideri olarak sayilmaz (cift sayim).
#
# TUR 1 UYARISI:
#   - Hicbir navlun rakami FACT degildir. Tumu ESTIMATE veya UNKNOWN'dir.
#   - Navlun rakamlari ARALIKTIR. Model tek noktaya kilitlenmemelidir.
#   - Spot navlun ttl = 14d -> 2026-08-23 sonrasi STALE.
#   - Detay ve hesap adimlari: 40-lojistik/konteyner-kapasitesi.md
#                              40-lojistik/navlun-araliklari.md

meta:
  dosya: lojistik.yaml
  son_guncelleme: 2026-08-10
  tur: "TUR 2 — rota bazli maliyet matrisi (TUR 1 uzerine eklendi)"
  durum: KISMI_DOLU
  rapor: 40-lojistik/rapor-tur2-navlun-lojistik.md
  rapor_tur1: 40-lojistik/rapor-tur1-navlun-lojistik.md
  ek_dosyalar:
    - 40-lojistik/rota-maliyet-matrisi.md
    - 40-lojistik/lcl-vs-fcl-pilot.md
  acik_ticketlar: [T-301, T-302, T-303, T-304, T-305, T-311, T-312, T-313, T-314]
  acik_celiskiler: [C-301, C-302, C-303, C-311, C-312, C-313]
  tur2_uyarisi: >
    TUR 2'de LCL navlunu 9 rota icin GERCEK, TARIHLI, GECERLILIK SURELI
    kotasyonla dolduruldu (ttl 6d, 2026-08-16'da STALE). FCL navlunu HALA
    UNKNOWN'dir: test edilen 14 Turkiye varisli lane'in hicbirinde kamuya
    acik FCL kotasyonu yoktur (EV-2026-08-10-312). T-304'un FCL ayagi
    KAPANMAMISTIR.
  para_birimi_uyarisi: >
    TUR 2 lojistik maliyeti UC PARA BIRIMINDEDIR (USD okyanus + EUR mense
    local + TRY Turkiye operasyonu) ve TEK SAYIYA INDIRGENMEMISTIR, cunku
    makro.yaml -> fx.usd_try ve fx.eur_try hala null. Toplama islemi
    finans-fizibilite'nindir -> T-311.

